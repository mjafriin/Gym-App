<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jafriin Gym">
<title>Jafriin Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1c1c1c;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text-dim: #888;
    --text-dimmer: #555;

    --mon: #2ecc71; --mon-bg: #0d2b1a; --mon-pill: #1a4a2a;
    --tue: #3b9eff; --tue-bg: #0d1f35; --tue-pill: #0d2d4f;
    --wed: #a78bfa; --wed-bg: #1a1030; --wed-pill: #2a1a4a;
    --thu: #f59e0b; --thu-bg: #2a1a00; --thu-pill: #3a2500;
    --fri: #ef4444; --fri-bg: #2a0d0d; --fri-pill: #3a1010;
    --sat: #ec4899; --sat-bg: #2a0d1f; --sat-pill: #3a1028;
    --sun: #64748b; --sun-bg: #111518; --sun-pill: #1e2530;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: -webkit-fill-available;
    overflow-x: hidden;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ── TOP NAV ── */
  .day-nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 12px 16px 0;
    padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
    border-bottom: 1px solid var(--border);
  }

  .day-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 12px;
  }
  .day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    min-width: 70px;
  }
  .day-tab .tab-day { font-size: 13px; font-weight: 600; color: var(--text-dim); }
  .day-tab .tab-type { font-size: 10px; color: var(--text-dimmer); margin-top: 1px; }

  .day-tab.active-mon { background: var(--mon-bg); border-color: var(--mon); }
  .day-tab.active-mon .tab-day { color: var(--mon); }
  .day-tab.active-tue { background: var(--tue-bg); border-color: var(--tue); }
  .day-tab.active-tue .tab-day { color: var(--tue); }
  .day-tab.active-wed { background: var(--wed-bg); border-color: var(--wed); }
  .day-tab.active-wed .tab-day { color: var(--wed); }
  .day-tab.active-thu { background: var(--thu-bg); border-color: var(--thu); }
  .day-tab.active-thu .tab-day { color: var(--thu); }
  .day-tab.active-fri { background: var(--fri-bg); border-color: var(--fri); }
  .day-tab.active-fri .tab-day { color: var(--fri); }
  .day-tab.active-sat { background: var(--sat-bg); border-color: var(--sat); }
  .day-tab.active-sat .tab-day { color: var(--sat); }
  .day-tab.active-sun { background: var(--sun-bg); border-color: var(--sun); }
  .day-tab.active-sun .tab-day { color: var(--sun); }

  /* ── MAIN ── */
  .main { padding: 0 16px 100px; }

  .day-header {
    padding: 20px 18px;
    border-radius: 16px;
    margin: 16px 0 20px;
  }
  .day-header h1 { font-size: 28px; font-weight: 700; }
  .day-header .subtitle { font-size: 14px; color: rgba(255,255,255,0.55); margin-top: 4px; }

  .day-header.mon { background: linear-gradient(135deg, var(--mon-bg), #0a1a10); border: 1px solid #1a3a22; }
  .day-header.tue { background: linear-gradient(135deg, var(--tue-bg), #091525); border: 1px solid #0d2540; }
  .day-header.wed { background: linear-gradient(135deg, var(--wed-bg), #120b25); border: 1px solid #221040; }
  .day-header.thu { background: linear-gradient(135deg, var(--thu-bg), #1c1000); border: 1px solid #3a2800; }
  .day-header.fri { background: linear-gradient(135deg, var(--fri-bg), #1c0808); border: 1px solid #3a1212; }
  .day-header.sat { background: linear-gradient(135deg, var(--sat-bg), #1c0810); border: 1px solid #3a1020; }
  .day-header.sun { background: linear-gradient(135deg, var(--sun-bg), #0a0d10); border: 1px solid #1a2030; }

  /* ── SECTION ── */
  .section { margin-bottom: 24px; }
  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    color: var(--text-dimmer); text-transform: uppercase;
    margin-bottom: 10px;
  }
  .section-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }

  .exercises-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
  }

  .exercise-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    cursor: pointer;
    transition: background 0.15s;
    -webkit-user-select: none;
    user-select: none;
  }
  .exercise-row:last-child { border-bottom: none; }
  .exercise-row:active { background: var(--surface2); }
  .exercise-row.done { opacity: 0.45; }
  .exercise-row.done .ex-name { text-decoration: line-through; }

  .ex-name { font-size: 15px; font-weight: 400; color: var(--text); flex: 1; }
  .ex-check {
    width: 20px; height: 20px; border-radius: 50%;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .exercise-row.done .ex-check {
    background: #2ecc71;
    border-color: #2ecc71;
  }
  .exercise-row.done .ex-check::after {
    content: '';
    width: 5px; height: 8px;
    border: 2px solid #000;
    border-top: none; border-left: none;
    transform: rotate(45deg) translateY(-1px);
    display: block;
  }

  .pill {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* pill colours per day */
  .pill-mon { background: var(--mon-pill); color: var(--mon); }
  .pill-tue { background: var(--tue-pill); color: var(--tue); }
  .pill-wed { background: var(--wed-pill); color: var(--wed); }
  .pill-thu { background: var(--thu-pill); color: var(--thu); }
  .pill-fri { background: var(--fri-pill); color: var(--fri); }
  .pill-sat { background: var(--sat-pill); color: var(--sat); }
  .pill-sun { background: var(--sun-pill); color: var(--sun); }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 0;
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
    z-index: 200;
  }
  .nav-item {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
    cursor: pointer;
    padding: 4px 0;
    opacity: 0.45;
    transition: opacity 0.2s;
  }
  .nav-item.active { opacity: 1; }
  .nav-item .nav-icon { font-size: 20px; line-height: 1; }
  .nav-item .nav-label { font-size: 10px; font-weight: 500; color: var(--text-dim); }

  /* ── VIEWS ── */
  .view { display: none; }
  .view.active { display: block; }

  /* ── LOG VIEW ── */
  .log-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dimmer);
  }
  .log-entry {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .log-entry-date { font-size: 12px; color: var(--text-dimmer); margin-bottom: 4px; }
  .log-entry-day { font-size: 16px; font-weight: 600; }
  .log-entry-count { font-size: 13px; color: var(--text-dim); margin-top: 2px; }

  /* ── STATS VIEW ── */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
  }
  .stat-num { font-size: 32px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--text-dimmer); margin-top: 4px; }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    margin-top: 10px;
  }
  .week-day-cell {
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: var(--text-dimmer);
    flex-direction: column; gap: 2px;
  }
  .week-day-cell.attended { background: #0d2b1a; border-color: var(--mon); }
  .week-day-cell.attended span { color: var(--mon); }

  /* ── SECTION HEADER ── */
  .section-header {
    font-size: 22px; font-weight: 700;
    padding: 20px 16px 4px;
  }
  .section-sub {
    font-size: 13px; color: var(--text-dimmer);
    padding: 0 16px 16px;
  }

  /* ── PROGRESS BAR ── */
  .progress-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex; align-items: center; gap: 12px;
  }
  .progress-bar-outer {
    flex: 1;
    background: var(--surface2);
    border-radius: 6px;
    height: 6px;
    overflow: hidden;
  }
  .progress-bar-inner {
    height: 100%;
    border-radius: 6px;
    background: var(--mon);
    transition: width 0.3s ease;
  }
  .progress-text { font-size: 13px; font-weight: 600; color: var(--text-dim); white-space: nowrap; }

  /* ── REST TIMER ── */
  .rest-timer {
    position: fixed;
    bottom: 80px; right: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 12px 16px;
    display: flex; align-items: center; gap: 10px;
    z-index: 300;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transform: translateY(120px);
    opacity: 0;
    transition: all 0.3s ease;
  }
  .rest-timer.visible { transform: translateY(0); opacity: 1; }
  .timer-time { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: var(--mon); }
  .timer-label { font-size: 11px; color: var(--text-dimmer); }
  .timer-close { font-size: 18px; cursor: pointer; color: var(--text-dimmer); }

  /* hide scroll on day panel when switching */
  .day-panel { display: none; }
  .day-panel.active { display: block; }
</style>
</head>

</main>

</nav>

<!-- REST TIMER -->
<div class="rest-timer" id="restTimer">

    <div class="timer-time" id="timerDisplay">1:30</div>

  <div class="timer-close" onclick="stopTimer()">✕</div>

        { name: 'Glute bridge marches', sets: '3×10' },
        { name: 'Kneeling pushups', sets: '4×12' },
      ]},
      { name: 'Core', exercises: [
        { name: 'DB suitcase carry', sets: '3×20 steps each' },
        { name: 'Plank shoulder tap', sets: '3×12 each' },
        { name: 'Dead bug — slow tempo', sets: '2×10' },
      ]},
      { name: 'Deep Flexibility', exercises: [
        { name: 'Butterfly + forward fold', sets: '2 min' },
        { name: 'Standing forward fold', sets: '90 sec' },
        { name: 'Lizard lunge', sets: '90 sec each' },
        { name: 'Pigeon pose', sets: '2 min each' },
        { name: 'Seated spinal rotation', sets: '60 sec each' },
        { name: 'Legs up the wall', sets: '5 min' },
      ]},
    ]
  },
  {
    id: 'sat', label: 'Sat', type: 'Active Rest', color: 'sat',
    title: 'Saturday', subtitle: 'Active Recovery · ~30 min',
    sections: [
      { name: 'Recovery', exercises: [
        { name: 'Walk (outdoor or treadmill)', sets: '20–30 min' },
        { name: 'Full body stretch flow', sets: '10 min' },
        { name: 'Foam roll legs + back', sets: '5 min' },
      ]},
    ]
  },
  {
    id: 'sun', label: 'Sun', type: 'Rest', color: 'sun',
    title: 'Sunday', subtitle: 'Rest Day · Recharge',
    sections: [
      { name: 'Optional', exercises: [
        { name: 'Light walk', sets: '20 min' },
        { name: 'Stretching / yoga', sets: '15 min' },
      ]},
    ]
  },
];

// ═══════════════════════════════════════════════
// STATE & STORAGE
// ═══════════════════════════════════════════════
let state = {
  activeDay: 'mon',
  activeView: 'today',
  checked: {},   // { 'mon-0-3': true }
  log: [],       // [{ date, dayId, dayTitle, count, total }]
  timerInterval: null,
  timerSeconds: 0,
};

function save() {
  try {
    localStorage.setItem('jg_checked', JSON.stringify(state.checked));
    localStorage.setItem('jg_log', JSON.stringify(state.log));
  } catch(e) {}
}

function load() {
  try {
    const c = localStorage.getItem('jg_checked');
    const l = localStorage.getItem('jg_log');
    if (c) state.checked = JSON.parse(c);
    if (l) state.log = JSON.parse(l);
  } catch(e) {}
}

// ═══════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════
function getColor(dayId) {
  return `var(--${dayId})`;
}

function renderDayTabs() {
  const container = document.getElementById('dayTabs');
  container.innerHTML = DAYS.map(d => `
    <div class="day-tab ${state.activeDay === d.id ? 'active-'+d.id : ''}"
         onclick="selectDay('${d.id}')">
      <div class="tab-day">${d.label}</div>
      <div class="tab-type">${d.type}</div>
    </div>
  `).join('');
}

function renderPlan() {
  const container = document.getElementById('dayPanels');
  container.innerHTML = DAYS.map(d => `
    <div class="day-panel ${state.activeDay === d.id ? 'active' : ''}" id="panel-${d.id}">
      <div class="day-header ${d.id}">
        <h1>${d.title}</h1>
        <div class="subtitle">${d.subtitle}</div>
      </div>
      ${renderProgress(d)}
      ${d.sections.map((s, si) => renderSection(d, s, si)).join('')}
    </div>
  `).join('');
}

function renderProgress(day) {
  const total = day.sections.reduce((a, s) => a + s.exercises.length, 0);
  const done = day.sections.reduce((a, s, si) =>
    a + s.exercises.filter((_, ei) => state.checked[`${day.id}-${si}-${ei}`]).length, 0);
  const pct = total ? Math.round(done / total * 100) : 0;
  return `
    <div class="progress-wrap">
      <div class="progress-bar-outer">
        <div class="progress-bar-inner" style="width:${pct}%;background:var(--${day.id})"></div>
      </div>
      <div class="progress-text">${done}/${total}</div>
    </div>`;
}

function renderSection(day, section, si) {
  return `
    <div class="section">
      <div class="section-label">
        <div class="section-dot" style="background:var(--${day.id})"></div>
        ${section.name}
      </div>
      <div class="exercises-card">
        ${section.exercises.map((ex, ei) => {
          const key = `${day.id}-${si}-${ei}`;
          const done = !!state.checked[key];
          return `
            <div class="exercise-row ${done ? 'done' : ''}" onclick="toggleExercise('${day.id}',${si},${ei})">
              <div class="ex-name">${ex.name}</div>
              <span class="pill pill-${day.id}">${ex.sets}</span>
              <div class="ex-check"></div>
            </div>`;
        }).join('')}
      </div>
    </div>`;
}

function renderLog() {
  const container = document.getElementById('logEntries');
  if (!state.log.length) {
    container.innerHTML = `<div class="log-empty">No workouts logged yet.<br>Complete exercises to log sessions.</div>`;
    return;
  }
  container.innerHTML = state.log.slice().reverse().map(entry => `
    <div class="log-entry">
      <div class="log-entry-date">${entry.date}</div>
      <div class="log-entry-day">${entry.dayTitle}</div>
      <div class="log-entry-count">${entry.count} / ${entry.total} exercises completed</div>
    </div>
  `).join('');
}

function renderStats() {
  const grid = document.getElementById('statsGrid');
  const totalSessions = state.log.length;
  const totalExercises = state.log.reduce((a, e) => a + e.count, 0);
  const streak = calcStreak();

  grid.innerHTML = `
    <div class="stat-card">
      <div class="stat-num" style="color:var(--mon)">${totalSessions}</div>
      <div class="stat-label">Total Sessions</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--tue)">${totalExercises}</div>
      <div class="stat-label">Exercises Done</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--fri)">${streak}</div>
      <div class="stat-label">Day Streak 🔥</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" style="color:var(--wed)">${calcWeekCount()}</div>
      <div class="stat-label">This Week</div>
    </div>`;

  renderWeekGrid();
}

function renderWeekGrid() {
  const grid = document.getElementById('weekGrid');
  const days = ['S','M','T','W','T','F','S'];
  const today = new Date();
  const dow = today.getDay();
  const weekDates = days.map((d, i) => {
    const date = new Date(today);
    date.setDate(today.getDate() - dow + i);
    return { label: d, dateStr: date.toDateString() };
  });
  const logDates = new Set(state.log.map(e => e.date));
  grid.innerHTML = weekDates.map(wd => {
    const attended = logDates.has(wd.dateStr);
    return `<div class="week-day-cell ${attended ? 'attended' : ''}">
      <span>${wd.label}</span>
    </div>`;
  }).join('');
}

function renderToday() {
  const container = document.getElementById('todayContent');
  const dow = new Date().getDay(); // 0=Sun,1=Mon...
  const dayMap = [6, 0, 1, 2, 3, 4, 5]; // Sun->index6, Mon->0 etc
  const todayDay = DAYS[dayMap[dow]];

  container.innerHTML = `
    <div class="day-header ${todayDay.id}" style="margin:16px 0 0">
      <h1>Today — ${todayDay.title}</h1>
      <div class="subtitle">${todayDay.subtitle}</div>
    </div>
    ${renderProgress(todayDay)}
    ${todayDay.sections.map((s, si) => renderSection(todayDay, s, si)).join('')}`;
}

// ═══════════════════════════════════════════════
// INTERACTIONS
// ═══════════════════════════════════════════════
function selectDay(dayId) {
  state.activeDay = dayId;
  document.querySelectorAll('.day-panel').forEach(p => p.classList.remove('active'));
  const panel = document.getElementById('panel-' + dayId);
  if (panel) panel.classList.add('active');
  renderDayTabs();
  if (state.activeView === 'today') {
    // scroll to top
    window.scrollTo(0, 0);
  }
}

function switchView(viewId) {
  state.activeView = viewId;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === viewId);
  });

  // Show/hide day tabs
  document.querySelector('.day-nav').style.display = viewId === 'plan' ? '' : 'none';

  if (viewId === 'log') renderLog();
  if (viewId === 'stats') renderStats();
  if (viewId === 'today') renderToday();
}

function toggleExercise(dayId, si, ei) {
  const key = `${dayId}-${si}-${ei}`;
  state.checked[key] = !state.checked[key];
  save();

  // Update DOM directly without full re-render
  const row = event.currentTarget;
  row.classList.toggle('done', state.checked[key]);

  // Update progress bar for this day
  const day = DAYS.find(d => d.id === dayId);
  const total = day.sections.reduce((a, s) => a + s.exercises.length, 0);
  const done = day.sections.reduce((a, s, sIdx) =>
    a + s.exercises.filter((_, eIdx) => state.checked[`${dayId}-${sIdx}-${eIdx}`]).length, 0);
  const pct = total ? Math.round(done / total * 100) : 0;

  // Update all progress bars for this day
  document.querySelectorAll(`#panel-${dayId} .progress-bar-inner`).forEach(b => {
    b.style.width = pct + '%';
  });
  document.querySelectorAll(`#panel-${dayId} .progress-text`).forEach(t => {
    t.textContent = `${done}/${total}`;
  });

  // Also update today view progress if on today view
  if (state.activeView === 'today') {
    document.querySelectorAll('#view-today .progress-bar-inner').forEach(b => {
      b.style.width = pct + '%';
    });
    document.querySelectorAll('#view-today .progress-text').forEach(t => {
      t.textContent = `${done}/${total}`;
    });
  }

  // Log session if milestone
  if (state.checked[key] && done >= Math.ceil(total * 0.5)) {
    logSession(dayId, day, done, total);
  }

  // Start rest timer
  if (state.checked[key]) startTimer(90);
}

function logSession(dayId, day, count, total) {
  const today = new Date().toDateString();
  const existing = state.log.find(e => e.date === today && e.dayId === dayId);
  if (existing) {
    existing.count = count;
    existing.total = total;
  } else {
    state.log.push({ date: today, dayId, dayTitle: day.title, count, total });
  }
  save();
}

// ═══════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════
function startTimer(seconds) {
  stopTimer();
  state.timerSeconds = seconds;
  updateTimerDisplay();
  document.getElementById('restTimer').classList.add('visible');
  state.timerInterval = setInterval(() => {
    state.timerSeconds--;
    if (state.timerSeconds <= 0) {
      stopTimer();
      // vibrate if supported
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    } else {
      updateTimerDisplay();
    }
  }, 1000);
}

function stopTimer() {
  clearInterval(state.timerInterval);
  document.getElementById('restTimer').classList.remove('visible');
}

function updateTimerDisplay() {
  const m = Math.floor(state.timerSeconds / 60);
  const s = state.timerSeconds % 60;
  document.getElementById('timerDisplay').textContent = `${m}:${s.toString().padStart(2,'0')}`;
}

function calcStreak() {
  if (!state.log.length) return 0;
  const dates = [...new Set(state.log.map(e => e.date))].sort((a,b) => new Date(b)-new Date(a));
  let streak = 0;
  let current = new Date();
  current.setHours(0,0,0,0);
  for (const d of dates) {
    const date = new Date(d);
    date.setHours(0,0,0,0);
    const diff = (current - date) / 86400000;
    if (diff <= 1) { streak++; current = date; }
    else break;
  }
  return streak;
}

function calcWeekCount() {
  const today = new Date();
  const dow = today.getDay();
  const weekStart = new Date(today);
  weekStart.setDate(today.getDate() - dow);
  weekStart.setHours(0,0,0,0);
  return new Set(state.log.filter(e => new Date(e.date) >= weekStart).map(e => e.date)).size;
}

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
function init() {
  load();

  // Set active day to today
  const dow = new Date().getDay();
  const dayMap = [6, 0, 1, 2, 3, 4, 5];
  state.activeDay = DAYS[dayMap[dow]].id;

  renderDayTabs();
  renderPlan();
  renderToday();

  // Start on Today view
  switchView('today');
}

init();
</script>
